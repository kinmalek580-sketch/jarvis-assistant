name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          

      - name: Extract project ZIP
        run: |
          unzip -q JARVIS_Android_Starter_CloudBuild.zip -d extracted
          test -d extracted/JARVIS_Android_Starter/android-app

      - name: Build APK
        working-directory: extracted/JARVIS_Android_Starter/android-app
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: extracted/JARVIS_Android_Starter/android-app/app/build/outputs/apk/debug/app-debug.apk
