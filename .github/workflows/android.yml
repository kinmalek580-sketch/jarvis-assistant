
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check project ZIP
        run: test -f JARVIS_Android_Starter_CloudBuild.zip

      - name: Extract project
        run: |
          unzip -q JARVIS_Android_Starter_CloudBuild.zip -d extracted
          test -d extracted/JARVIS_Android_Starter/android-app

      - name: Build APK
        working-directory: extracted/JARVIS_Android_Starter/android-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: extracted/JARVIS_Android_Starter/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
